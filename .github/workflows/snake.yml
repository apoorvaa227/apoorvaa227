name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Set this to run daily
  workflow_dispatch:  # Allows you to trigger manually

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Generate GitHub Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}  # Automatically uses the repo owner's username
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Commit and push generated files
        uses: EndBug/add-and-commit@v9
        with:
          add: 'dist/*'  # This will add all files in the dist/ folder
          message: 'Update GitHub Snake Animation'
          author_name: 'GitHub Actions'
          author_email: 'github-actions@github.com'

